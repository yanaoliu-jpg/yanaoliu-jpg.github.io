<!DOCTYPE html>
<!--
  html_class 只有首页是 " theme-home"（带前导空格），其余页面是空串。
  它只表示「这是首页」；颜色见下面那段主题脚本和 style.css 的 data-theme（放映厅改版设计.md 第四节）。
  body_attrs 同理：内页是 ' style="--c1: …"'（本页的颜色，光晕和进度条用），首页是空串。
-->
<html lang="{{ html_lang }}" class="no-js{{ html_class }}">
<head>
<meta charset="utf-8">
<script>
document.documentElement.classList.remove('no-js');
/*
  换页动画（View Transitions，样式在 style.css 末尾）：首页封面 ↔ 内页光晕、首页标题 ↔ 内页大标题
  要形变过去，两边就得有同一个 view-transition-name。名字**只临时给点的那一张**——
  首页十张卡全写死的话，没配上对的九张会浮在新页面上面淡出。
  必须写在 <head> 里：pagereveal 在新页面第一帧之前就触发，type="module" 的脚本赶不上。
  浏览器不支持就整段跳过，只剩光圈换页；再不支持就是普通跳转。

  配对靠 sessionStorage 里一句暗号（"旧页>新页"）：旧页真起了名才写，新页对上了才起。
  两边各自判断的话，一边起了名另一边没起，那个落单的就会浮在新页面上面淡出。
*/
(function () {
  if (!('onpagereveal' in window)) return;
  var home = document.documentElement.classList.contains('theme-home');
  var KEY = 'vt-pair';
  function key(url) {                     // "/zh/good-night/" → "good-night"；首页 → ""
    var p = new URL(url, location.href).pathname.split('/').filter(Boolean);
    if (p[0] === 'zh') p.shift();
    return p[0] || '';
  }
  function pairs(other) {                 // 这一页上跟「另一页」配对的元素
    if (home) {
      var card = document.querySelector('.work[data-slug="' + other + '"]');
      return card ? [[card.querySelector('.work__frame'), 'cover'],
                     [card.querySelector('.work__title'), 'title']] : [];
    }
    if (other) return [];                 // 内页只跟首页配对；内页之间只走光圈
    return [].map.call(document.querySelectorAll('[data-vt]'),
                       function (el) { return [el, el.getAttribute('data-vt')]; });
  }
  function name(list) {                   // 只给看得见的起名；返回撤销函数和起了几个
    var named = list.filter(function (p) {
      var r = p[0] && p[0].getBoundingClientRect();
      return r && r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight;
    });
    named.forEach(function (p) { p[0].style.viewTransitionName = 'vt-' + p[1]; });
    return { n: named.length, undo: function () {
      named.forEach(function (p) { p[0].style.viewTransitionName = ''; });
    } };
  }
  function store(v) {                     // 两页之间对暗号：旧页起了名，新页才起
    try { if (v) sessionStorage.setItem(KEY, v); else sessionStorage.removeItem(KEY); } catch (e) {}
  }
  addEventListener('pageswap', function (e) {
    store('');
    var to = e.activation && e.activation.entry;
    if (!e.viewTransition || !to) return;
    // 内页回首页只在「后退」时配对：点「全部作品」回去，首页在最顶上，那张卡根本不在屏幕里
    if (!home && e.activation.navigationType !== 'traverse') return;
    var got = name(pairs(key(to.url)));
    if (!got.n) return;
    store(key(location.href) + '>' + key(to.url));
    // 从往返缓存（bfcache）回到这一页时名字不能还挂着，不然下次换页会带着它
    addEventListener('pageshow', got.undo, { once: true });
  });
  addEventListener('pagereveal', function (e) {
    var pair = '';
    try { pair = sessionStorage.getItem(KEY) || ''; } catch (err) {}
    store('');
    var ends = pair.split('>');
    if (!e.viewTransition || ends.length !== 2 || ends[1] !== key(location.href)) return;
    e.viewTransition.finished.finally(name(pairs(ends[0])).undo);
  });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="color-scheme" content="{{ color_scheme }}">
<meta name="theme-color" content="{{ theme_color }}">
<script>
/*
  亮暗模式（2026-09-29「放映厅」改版）：默认暗色；读者点过切换、选了亮色，就记在 localStorage 的 theme 里。
  必须写在样式表之前：先把 data-theme 设好再画第一帧，换页才不会先闪一下暗色。
  隐私模式下 localStorage 会抛错——拿不到就当暗色。亮色的 theme-color 由 build.py 按页面写进来。
*/
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light') return;
  document.documentElement.setAttribute('data-theme', 'light');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', '{{ light_theme_color }}');
  document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'light');
})();
</script>

<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">

{{ alternates }}

<link rel="icon" href="{{ root }}/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ root }}/static/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ root }}/static/apple-touch-icon.png">

<link rel="preload" href="{{ root }}/static/fonts/dm-sans-latin.woff2" as="font"
      type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ root }}/static/style.css">
</head>
<body{{ body_attrs }}>
{{ body }}
<script src="{{ root }}/static/gallery.js" defer></script>
{{ scripts }}
</body>
</html>
