<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.remove('no-js')</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0e11">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">

<link rel="icon" href="{{ root }}/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ root }}/static/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ root }}/static/apple-touch-icon.png">

<link rel="preload" href="{{ root }}/static/fonts/newsreader-latin.woff2" as="font"
      type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ root }}/static/style.css">
</head>
<body>
{{ body }}
<script src="{{ root }}/static/gallery.js" defer></script>
</body>
</html>
