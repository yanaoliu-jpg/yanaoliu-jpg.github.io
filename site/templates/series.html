<a class="skip" href="#plates">{{ skip }}</a>

{{ sitenav }}
<div class="progress" aria-hidden="true"></div>

<main class="page">

  <header class="masthead">
    <div class="masthead__card">
      <!--
        光晕：本组封面取出来的 --c1..3（写在 <body> 上）。它是标题卡里的第一个弹性项，
        占掉标题上方那一整段空白，下沿停在第一行字上面——标题几行都一样，
        所以永远不会压在任何字下面。见 透过镜头设计.md「内页」。
      -->
      <div class="glow" data-vt="cover" aria-hidden="true"></div>
      <p class="masthead__eyebrow">{{ eyebrow }} <span aria-hidden="true">·</span> {{ year }}</p>
      <h1 class="masthead__title" data-vt="title">{{ title }}</h1>
      <p class="masthead__meta"><span>{{ count_label }}</span> <span>{{ span }}</span> <span>{{ place }}</span></p>
    </div>

    <div class="statement">
      {{ statement }}
    </div>

    <p class="masthead__scroll" aria-hidden="true">{{ scroll }}</p>
  </header>

  <section class="plates" id="plates">
{{ plates }}
  </section>

  <nav class="nextup" aria-label="{{ nextup_label }}">
    <a class="nextup__link" href="{{ nextup_href }}" style="{{ nextup_vars }}">
      <span class="nextup__label">{{ nextup_label }}</span>
      <span class="nextup__title">{{ nextup_title }}</span>
      <span class="nextup__meta">{{ nextup_meta }}</span>
    </a>
  </nav>

  <footer class="colophon">
    <p class="colophon__gear">{{ colophon }}</p>
    <p class="colophon__name">{{ author }}</p>
  </footer>

</main>

<dialog class="viewer" id="viewer" aria-label="{{ viewer_label }}">
  <button class="viewer__close" type="button" data-act="close" aria-label="{{ close_label }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <button class="viewer__nav viewer__nav--prev" type="button" data-act="prev"
          aria-label="{{ prev_label }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4L7 12l8 8"/></svg>
  </button>
  <button class="viewer__nav viewer__nav--next" type="button" data-act="next"
          aria-label="{{ next_label }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
  </button>

  <figure class="viewer__stage">
    <picture class="viewer__picture">
      <source type="image/avif"><source type="image/webp">
      <img alt="">
    </picture>
    <figcaption class="viewer__caption">
      <span class="viewer__count"></span>
      <span class="viewer__date"></span>
      <span class="viewer__exif"></span>
    </figcaption>
  </figure>
</dialog>

<script type="application/json" id="photo-data">{{ photo_data }}</script>
