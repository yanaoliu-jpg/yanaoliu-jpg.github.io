# ── 50 ── 寄生虫 ─────────────────────────────────
[[entry]]
year  = 2019
title = "Parasite"
text  = "Another masterpiece from Bong Joon-ho: a film that reflects the enormous gap between rich and poor in Korea. It uses metaphor and staging to show, vividly and concretely, the division of wealth and the contradiction between rich and poor that cannot be bridged. In terms of content, the solid script already lays a good foundation, and the director handles the transitions and turns of the plot especially well; the ending flows cleanly too. He uses the rise and fall of the music to carry the rise and fall of feeling, and to show what shifts inside the characters. Slow motion and lateral movement are still his stock in trade and mark his personal style. The lighting is very well handled: warm and cool tones express elation and suppression, and the contrast of light and dark brings out the division of class. All told, Parasite is a film with a style of its own that reflects the unequal structure of contemporary Korean society. From its release in 2019 to when I watched it, it had climbed into the top 150 — and it deserves it."
  [entry.zh]
  title = "寄生虫"
  text  = "奉俊昊导演的又一部神作！一部反应韩国极大的贫富差距的作品 巧妙用隐喻和制袋生动形象的将贫富分化和富人与穷人间不可隔阂的矛盾体现的淋漓尽致 从内容上来说 扎实的剧本就已经奠定了一个好底子 导演在拍摄上对情节的过渡和转折处理的特别好 结尾也很流畅通顺 导演用音乐的起伏舒缓体现情绪的升降 也展现了 人物内心的情绪变换 升格和横向移动依旧是奉俊昊导演的老本行 体现个人风格 此外 灯光处理的非常好 冷暖色调表达了情绪的高涨和压抑 明暗对比突出阶级的分化 总体来说 《寄生虫》是一部反应当代韩国社会结构不均和贫富分化等社会问题的带有风格特色的电影 从2019年上映到我观影时已经冲到top前150是实至名归"

# ── 51 ── 爱在日落黄昏时 ─────────────────────────────────
