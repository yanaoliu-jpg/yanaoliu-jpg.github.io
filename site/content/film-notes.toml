# ── 29 ── 阿凡达 ─────────────────────────────────
[[entry]]
year  = 2009
title = "Avatar"
text  = "After The Matrix, another epic that remade what a film could look like. The plot is well built, and the way the ending lifts its theme took me by surprise. Its argument is that we should protect the environment and treasure life on this planet, and that our fates are bound together. Beyond that, the shooting feels technological and stays coherent, especially the first-person tension of arriving on Pandora. The camera circles its subjects again and again to open up a location without letting the image go dull, and pulling the camera back to reveal a character's surroundings looks wonderful to me. I did feel the film runs a little long, and the motion capture was not yet mature — though already very good. The fights are exciting, but not quite to my taste."
  [entry.zh]
  title = "阿凡达"
  text  = "继《黑客帝国》之后，又一部伟大的视觉革新的史诗，剧情设计的很好结尾升华主题很惊喜，这部片的立意是告诫人类要保护环境，珍爱地球生命共，也提倡促进人类命运共同体。除此之外，在拍摄手法上，镜头充满科技感也很连贯，尤其是用第一人称代入进入潘多拉星球的紧张感，此外影片多次环绕运镜达到展现场景的作用，也不会让画面变得那么乏味。还有就是镜头后退展现人物背景我觉得很帅。我感觉这部影片稍长，动作捕捉技术还没那么成熟，但已经很好，还有就是打斗戏很刺激但不是很合我胃口。"

# ── 30 ── 拯救大兵瑞恩 ─────────────────────────────────
[[entry]]
year  = 1998
title = "Saving Private Ryan"
text  = "One of a kind among war films, and history will not produce another like it. Story, narration, sets and props are beyond reproach. There are a great many long lenses and a lot of structural composition. It favours over-the-shoulder shots from above and from below, with the camera at about thirty degrees to the actor, and the focal lengths look to be around 60–70mm. It often begins on a close-up and pulls back to reveal the whole scene — the use of the wide view has clearly been thought about carefully. The handheld work adds a particular kind of shake that matches the tension the film wants the audience to feel, and the camera repeatedly follows from behind a soldier and then moves round in front of him, which pulls you in. The long takes that open the film are executed at a very high level and drop the audience into the situation at once."
  [entry.zh]
  title = "拯救大兵瑞恩"
  text  = "战争片里的独一无二，历史上也绝不会再拍出这样的战争片了，剧情、叙事、场景和道具都无可挑剔。影片有大量长焦镜头，也有很多结构性构图。多使用过肩俯拍和仰拍，摄像机与人物的夹角呈30度，拍摄所使用的焦段大概是60-70mm，经常用以特写镜头出发，后拉展现全景的拍摄手法，对于全景的运用是经过仔细琢磨的。此外手持拍摄加入了特定的晃动，符合影片所要给观众呈现的紧张感，摄影机有大量背后跟拍挪至身前的手法，增加代入感。开篇大量长镜头完成度很高，也使观众被迅速带入情境中。"

# ── 31 ── 飞越疯人院 ─────────────────────────────────
[[entry]]
year  = 1975
title = "One Flew Over the Cuckoo's Nest"
text  = "I did not really follow it the first time. Only after reading what others wrote did I understand that the shot on McMurphy's forehead near the end implies surgery — his memory erased, his nature already gone. When the Chief smothers him, he is in fact freeing him from the world outside and giving him a physical freedom. The doctors reminding them daily to take their medication and holding group sessions looks like help, but is really a way of confining their minds. McMurphy's arrival breaks that silent system: he starts teaching the \"patients\" basketball, building a casino, even making demands of the nurse. As for why the nurse stops him being discharged — perhaps it is her anger at a singular person breaking the rules. In short, the ward stands for the system, and the nurse for the people inside it. On camera language: several of the card-playing shots use the onlookers as foreground, which conveys how alive the room is. In a corridor with real depth you can shoot from fixed positions at either end, and when people are passing through, different focal lengths can carry that too. Some interiors are established on a long lens, which lets you leave out the secondary detail and keeps the image from going flat even when nothing is moving and there is little colour."
  [entry.zh]
  title = "飞越疯人院"
  text  = "第一遍没看太懂，看了评论才知道影片最后给到麦克脑门的镜头是暗示脑部做过手术是代表麦克的记忆被抹去，已经失去了他的本性。酋长将麦克捂死实则是帮麦克摆脱现实社会带他实现物理上的自由。 医生每天提醒他们吃药和开小组讨论会看似是在帮助他们，实则是在禁锢他们的思想。麦克的到来打破了这种缄默的制度，他开始教\"患者\"们打篮球 建造赌场，甚至对护士提要求。至于护士为什么阻止麦克出院可能是因为她对独特个体打破规矩的愤怒。总之疯人院暗示了体制，护士暗示体制内的人。镜头语言方面，有几个打牌的镜头用围观的人当前景，能体现场面热闹，此外在有纵深的楼道内拍摄时可以在前后采用固定机位拍摄，特别是在有人来往时也可以用不同焦段体现。此外有些室内场景用长焦镜头交代，这样能省略次要，也能让画面即使没有动的物体或缺少色彩时也不乏味"

# ── 32 ── 小鞋子 ─────────────────────────────────
[[entry]]
year  = 1997
title = "Children of Heaven"
text  = "A short story, but a full one — moving, and with a child's clarity. At the end the goldfish swim up around Ali's feet, as if his sister has forgiven him at last. The running is shot first-person on a slightly wide lens; the head-on shots retreat before him on a long lens; the side views are slow motion, tracking across. The neighbourhood the boy lives in suits a long lens, which brings out its depth. I love the camera when the coach times Ali: it tracks sideways, fast, keeping pace with him, and stops only when the coach comes into frame holding the watch."
  [entry.zh]
  title = "小鞋子"
  text  = "故事很短，但是内容很丰富。很感人、童真的一部影片。最后金鱼游到阿里的腿边，仿佛是妹妹最终原谅了哥哥。跑步时的第一人称用稍广的焦段，正面后退的运动镜头用长焦拍摄，侧面用升格横移，影片里男主所在的生活环境很适合长焦，可以拍出纵深感。很喜欢影片中教练给阿里测试时的运镜，镜头跟随阿里跑步的动作快速横移直到出现教练拿着表计时的画面时停下。"

# ── 33 ── 沉默的羔羊 ─────────────────────────────────
[[entry]]
year  = 1991
title = "The Silence of the Lambs"
text  = "I did not understand it the first time. Under two hours, the cutting rhythm feels a little compressed. The conversations between Clarice and Lecter are a model of how to study a film shot by shot. Lecter is built from every direction and through many other characters, and the way the ending hints at the theme is the finishing stroke. The low melody of the score and the leaping violin lay another layer of suspense over the whole thing. When the film takes a character's subjective view it combines a head-on close-up with a first-person wide angle, to show the change in feeling and what is going on inside them. The flashbacks outside the main plot are cut cleanly too, always moving from a shot facing the character straight into first person, which speeds the rhythm up cheaply and well. The scene where Clarice searches the old garage — the set, the props, the lighting, the sound, the score — puts you inside her feelings immediately. Enclosed spaces are introduced with a circling camera and long-lens pans. Several arrangements of colour and cold light leave you oppressed and tense. The overall palette leans vivid while the exteriors are graded cool, and a push-in signals a subjective view and the information that matters. The actors' movements and micro-expressions are at a very high level."
  [entry.zh]
  title = "沉默的羔羊"
  text  = "第一遍没看懂。不到两个小时的影片让剪辑节奏略显紧凑。克拉丽斯与汉尼拔的几场对话戏堪称拉片典范。对汉尼拔人物形象的塑造是全方位且多主体的。结尾对电影主题的暗示是点睛之笔。配乐低沉的旋律和音符跳动的小提琴为这部史诗更加渲染了一层悬疑的氛围。影片在拍摄人物主观视角时用正面特写和第一人称广角的组合展现人物情绪变化和心理活动。对于主线剧情之外的闪回情节也剪辑的干脆利落，都是以人物正打直接过度到第一人称，讨巧的加快了节奏。克拉丽斯探查旧车库的场景、道具、布光、声音和配乐将观众迅速代入人物情绪中。对封闭空间环境的介绍用环绕运镜加长焦摇移的拍摄手法展现。几次色彩和冷光的布设让人感到压抑、紧张 。影片色调整体偏鲜艳，对于室外环境的调色偏冷，推进运镜预示人物主观视角和关键信息。演员们的动作和微表情都展现了高水准"

# ── 34 ── 银翼杀手2049 ─────────────────────────────────
[[entry]]
year  = 2017
title = "Blade Runner 2049"
text  = "I have not seen the first one, so parts of this were lost on me. This must be Villeneuve's finest work as a master of light. Sets, lighting, effects and music are all taken as far as they will go. The exteriors mostly come with rain and heavy fog, which brings out the end-of-the-world feeling of that future. The interiors are lit with great precision: wide-angle shots from above, combined with moving light and shadow and a desert-toned grade, give a sense of mystery and of ritual. Enormous computing power renders the crowded city and the neon night markets of the future as pure science fiction. There is not much dialogue, and the shooting stays mostly with the lead, which expresses directly how cold and empty the world is. What moved me most is Villeneuve's shallow focus: it shows the subject's movement and expression while also implying and pushing the story forward. It was the first time I felt the appeal of what lies outside the focal plane, and the first time I recognised this way of watching — a kind of third-person looking-in."
  [entry.zh]
  title = "银翼杀手2049"
  text  = "没看过第一部，这一部有部分没看懂。这应该是用光大师维伦纽瓦最封神的一部。场景、灯光、特效和音乐都做的淋漓尽致。室外场景多伴随雨天、大雾天气，突出未来世界的末日感。室内场景的灯光布置的很精细，广角端的俯拍搭配移动的光影以及沙漠色系的调色给人一种神秘感、仪式感。强大的电脑算力把未来世界下拥挤的城市、霓虹的夜市渲染的科幻感十足。本片的对白不多，拍摄也主要围绕主角进行，直接表现了影片中冷清的气氛。最打动我的是维伦纽瓦的浅焦拍摄手法，既能展现主 体的动作表情，又能暗示和推进故事情节，也让我第一次感受到了焦点外的魅力，认识了这种类似第三人称窥视的表现手法。"

# ── 35 ── 功夫 ─────────────────────────────────
[[entry]]
year  = 2004
title = "Kung Fu Hustle"
text  = "The best martial-arts film I have seen. Its photography, editing, technique, music and intent completely make up for the slightly absurd characters the genre hands it; its depth has gone past what a traditional wuxia film is. The high points for me are the technique and the cutting rhythm. Even though the film uses the crane a great deal, every shot carries a full load of information — nothing is surplus. The fast cutting leaves the audience with almost too much to take in, and even someone like me, who is not interested in action, gets carried along. Although it is an action film its audience is very wide, with threads of every kind woven into the main line. From the long take at the opening to the montage of time at the end, Chow's talent as a director is everywhere. For me the finishing stroke is the montage of imagery when Sing transforms — a cocoon becoming a butterfly — which shows the exact moment a character grows. The film is careful with its near-zero-angle wide shots from above, which introduce the space and give the frame tension at once, and I cannot help admiring the staging: nothing in it feels out of place. The lift at the very end brings tears."
  [entry.zh]
  title = "功夫"
  text  = "迄今为止看过的最好的武打片！影片的摄影、剪辑、手法、音乐和立意完美填补了武打片略显荒唐的人物角色和特性，其深度已经超越了传统武侠类型电影的范畴。我觉得影片的亮点在于拍摄手法和剪辑节奏。尽管影片多处运用了摇臂，但每个镜头所交代的信息很饱满，一点都不多余。《功夫》较快的剪辑节奏让观众有点目不暇接感觉，连我这种对动作戏不感兴趣的人也能被感染到。影片虽然类型是动作片，但受众却很广泛，主线中穿插着各种元素的支线。影片从开头的长镜头到结尾的时间蒙太奇，处处展现着周星驰作为导演的才华。我认为影片的点睛之笔是阿星蜕变时化茧成蝶的意向蒙太奇，能直接体现出人物角色成长的瞬间。影片对于广角近乎零角度的俯拍镜头很讲究，介绍环境的同时呈现了画面张力，还有不得不佩服影片的场面调度，毫无违和感。整部影片结尾的升华催人泪下"

# ── 36 ── 禁闭岛 ─────────────────────────────────
[[entry]]
year  = 2010
title = "Shutter Island"
text  = "A suspense film that works your head. It is a little puzzling the first time through. The story is very finely built, with almost no holes. Delusion is a subject that suits film, but few handle it well. Measured against A Beautiful Mind, Shutter Island turns more times and ends with more depth; it also carries some horror, and its casting lifts its standing further. On technique: the heavy rain at the opening and the shots inside the boat already set the film's suspense. Once they reach the island, real work goes into rendering the place — the wire fence in the foreground and the moving car, approaching the buildings fast in first person, the iron gates opening one after another along the way, the guards standing watch — all of it builds tension. The film has a lot of plot but the rhythm never drags: there is a great deal of jump-cutting, and several continuous actions matched with sound effects, a technique that pushes the story faster. Shot-reverse-shot shows a thing or a person appearing suddenly in front of someone, and the feeling that follows. Shooting a conversation from below brings out the latent conflict between people."
  [entry.zh]
  title = "禁闭岛"
  text  = "一部烧脑的悬疑片。第一遍看会稍微有点令人费解，影片的故事构架做的很细致，几乎没有漏洞。妄想症这类题材很适合拍成电影，但能拍好的并不多。对标《美丽心灵》，《禁闭岛》的剧情更一波三折，结局也更有深度，但《禁闭岛》还有些恐怖色彩，对演员的选择也抬高了这部影片的历史地位。从拍摄手法来说，开篇浓重的阴雨天气和船舱里的镜头就已经奠定了影片悬疑的基调，当男主一行人来到到岛上后，对岛上环境的刻画下足了功夫，比如前景的铁丝网和行驶的汽车，用第一人称快速接近建筑，沿路还有不断打开的铁门以及站岗的守望，都渲染了紧张的气氛。影片情节虽多，但节奏丝毫不拖泥带水，很多跳切的剪辑，几个连贯的动作配上音效，这种手法可以加快情节推进。另外，影片中出现正反打展现人物面前突然出现的事物和人物情绪。对话戏仰拍更能突出人物间潜在冲突"

# ── 37 ── 蝴蝶效应 ─────────────────────────────────
[[entry]]
year  = 2004
title = "The Butterfly Effect"
text  = "If you have ever felt you should not have been born, watch this film. A fine piece of storytelling with reasoning and suspense mixed in, and some horror as well. The lead lives out a different life in each parallel universe, and the palette changes with them: in the second ending, living with Kayleigh, the image is vivid and bright and highly saturated; in prison the grade goes cold and dim. Every memory sequence drops you into first person and holds your breath. Worth noting is the way the film connects its main line to another event or action happening at the same moment in the same space, moving to the new subject by camera movement or by following. The handling of the transitions is very natural. This is a film that cares about narrative logic above all."
  [entry.zh]
  title = "蝴蝶效应"
  text  = "如果你觉得你不该被生下，你可以看看这部电影！一部精彩的剧情夹杂推理和悬疑甚至有些恐怖色彩的影片。本片男主在不同平行宇宙中有不同人生轨迹，影片色调也随之而变。如第二个结局男主与凯丽生活在一起，影调呈现鲜艳亮丽，高饱和度。再如男主在监狱时色调冷淡阴暗……影片每个故事的回忆环节都以第一人称代入让人屏息凝神。值得一提的是影片在拍摄手法上用同一时刻同空间内发生的另一件事或一个动作联系上故事主线，可以通过运镜或跟随的方式移动至主体。另外在转场时的处理很自然。可以说这是一部更看重叙事逻辑的电影。"

# ── 38 ── 心灵捕手 ─────────────────────────────────
[[entry]]
year  = 1997
title = "Good Will Hunting"
text  = "A film with lines that stay with you, and a great deal beneath them. My reading of the ending is that Will finally understands what Sean has told him, makes peace with himself, and sets out to find what his life means. Sean is Will's hunter of the mind; the professor plays the reconciling part. Will's best friend is the catalyst that makes him think about work at all, and his time with Skylar shows his fragile side. The film opens by building Will and the professor through a few scenes, and although it is not long it draws its characters thoroughly. Its lines are, word for word, worth keeping, and every one offers the audience something. The technique is fairly conventional, but the film does work at the therapy conversations: when Sean and Will embrace, Will is shot from below and Sean roughly at eye level, which shows how much Will leans on him. A wonderful passage is Will's flood of words as he turns down the intelligence agency, where a push-in leads the audience into the monologue."
  [entry.zh]
  title = "心灵捕手"
  text  = "这是一部台词令人印象深刻、内容饱含深意的电影。我对结尾的理解是小韦最终理解了Sean的话并与自己和解，踏上了寻找生命意义的旅程。影片中的Sean是小韦的心灵捕手，而教授则充当调和剂的角色。小韦的好兄弟是促使小韦萌生找工作念头的催化剂，Skylar和小韦的交际则展现了小韦脆弱的一面。影片的开头就用几个场景着重塑造了小韦和教授的人物形象，影片虽不长但对人物性格和形象的刻画十分细致全面，片中的台词可谓字字金句，都能对观众有些启发。影片的拍摄手法比较常规，但对于心理辅导时的对话戏还是做了些文章，例如Sean和小韦拥抱时的画面，正拍小韦时是仰视的角度，对Sean的正打相对平视，可以看出小韦对Sean的依靠，一个比较精彩的转场是小韦在接受中情局的入职邀请时滔滔不绝的陈词用推进运镜的方式引导观众进入独白。"

# ── 39 ── 超脱 ─────────────────────────────────
[[entry]]
year  = 2011
title = "Detachment"
text  = "The story is oppressive, especially the chaos of the school at the end — one man reading a poem alone, and the loneliness in that is the whole film in miniature. On first viewing it felt too obscure; the frame of the story seemed to have no logic to it, let alone technique. Too much implication and philosophy is compressed into under two hours, and it comes out rough. From the opening, the lead speaking to camera in dim light and the chalk drawings already put a weight on you; then the pitch-black night, the silent crying alone on the bus, the saturated walls and the flashbacks loaded with grain all deepen it. Still, I very much like the middle section, the time the lead spends with Erica and the bright, lovely music that goes with it — it puts some life and some hope into a dark film. The saturated scenes are in fact expressing the character's own suppression, fear and collapse. The shooting feels low-budget: a lot of zooms, a lot of lost focus, and lighting that is a mess — I cannot tell whether that is deliberate. But the wide-angle head-on shots along the depth of the school corridors do have real atmosphere."
  [entry.zh]
  title = "超脱"
  text  = "影片的剧情太压抑，尤其是结尾混乱不堪的校园，一个人念着诗的孤独和寂寞，是整部影片的缩影。第一遍看感觉这部片太晦涩难懂了，故事框架仿佛也没有什么逻辑，更不要提什么手法之类的。太多暗示和哲理被压缩在这么一部不到2个小时的影片里略显粗糙。影片开头男主在昏暗的灯光下的自述和粉笔画就给人一种压抑的感觉，再往后漆黑的夜、独自坐在公交车上无声的哭泣、高饱和的墙壁和颗粒感拉满的闪回都加重了这一感觉。但我还是很喜欢影片中段男主和美丽卡共度时光的情节和欢快旋律优美的音乐，给这部偏黑暗的影片注入一点活力和积极向上的情绪。高饱和的场景其实提现了人物内心的压抑、恐惧和崩溃。本片拍摄给人一种制作成本不高的感觉，有大量的变焦、失焦、布光也是一塌糊涂，不知道是不是刻意而为。但是广角正拍配合学校楼道的纵深还是很有氛围感的。"

# ── 40 ── 低俗小说 ─────────────────────────────────
[[entry]]
year  = 1994
title = "Pulp Fiction"
text  = "A black comedy about gangsters. The director makes a 150-minute film out of three stories, each connected to the others. The score must be its greatest strength: the theme and the music over the transitions are all funny, and although the melody repeats it still makes you want to dance. Tarantino's characteristic low angle carries both the comedy and a kind of awkwardness in the relationships, and the waist-height view — not something you see often — is used especially well here, showing the swagger and the strut of these gangsters completely. In the corridor the camera combines a fixed position with a pan-follow, which takes you from bystander to participant: a very fine effect. The palette is mostly warm and on the saturated side, which leaves you restless, and seems to hint at how unsettled that era was. The film seems to want to say that this absurd world is full of uncertainty, and that justice looks different to everyone. Pulp Fiction opened a door for me into a new world — novelistic cinema — and it was the first time I appreciated Tarantino's aesthetics of violence."
  [entry.zh]
  title = "低俗小说"
  text  = "一部黑色幽默的黑帮电影。导演用三个故事组成了一部长达150分钟的电影，每段情节又彼此有联系。本片的配乐应该是最大亮点，不论是主题曲还是转场衔接时的配乐都很funny，虽然是重复的旋律但是依然给人一种想跳舞的感觉。昆汀·塔伦蒂诺用他特有的仰拍视角烘托了搞笑的气氛和一种尴尬的关系，腰间视角平时不常见但这部影片运用的特别好，把黑帮的横行霸道和威风凛凛展现的淋漓尽致。楼道里的机位用固定+摇跟的组合，给人一种从旁观者到参与者的感觉，十分微妙。影片的色调以暖色为主，饱和偏高，给人一种躁动不安的情绪，似乎也暗示了那个年代的风云变幻。影片似乎想要表达这个荒谬的世界充满了太多不确定性，人们眼中的正义各不相同。总之，《低俗小说》让我打开了新世界的大门，带我走进了小说式电影的世界，这也是我第一次欣赏昆汀的暴力美学"

# ── 41 ── 摩登时代 ─────────────────────────────────
[[entry]]
year  = 1936
title = "Modern Times"
text  = "An old film from 1936. Black and white and silent, and yet the acting, the dramatic effect, the editing and the use of montage put it on level terms with any colour picture. Five stars, deserved. Chaplin's fine performance and his humour not only bring the plight of America's unemployed during the Depression vividly to life, but also mock, from the side, the holes in capitalism — its disregard for working conditions, its single-minded pursuit of efficiency and output. What refreshed me most is the imagined passage where Chaplin and the girl live together, which shows how much the two of them long for a decent life."
  [entry.zh]
  title = "摩登时代"
  text  = "1936年的老片子，虽然是黑白无声，但是演员演技、戏剧效果、剪辑手法，蒙太奇的运用都让这部片子能和彩色影片相提并论。五星实至名归。本片用卓别林出色的演技搭配其幽默的性格特点，不仅生动的展现了经济危机下的美国失业者的生活窘境，侧面讽刺了资本主义的漏洞，以及不顾工人工作条件，一味追求工作效率、生产量的缺点。影片让人耳目一新的是卓别林和流浪少女一起过日子的那段想象画面，展现了两人对美好生活的渴望和向往。"

# ── 42 ── 海豚湾 ─────────────────────────────────
[[entry]]
year  = 2009
title = "The Cove"
text  = "The first documentary I ever watched, and one whose place in Douban's top 250 carries real weight. It was the first time I learned what happens to dolphins at Taiji, and how severe their situation is becoming. The crew used hidden cameras, aerial shots, night vision and underwater equipment to show the killing, and used interviews and first-person footage to show what bystanders think and know, and the absurd indifference of the Japanese government. The film is structured out of sequence, opening with night-vision shots of the cove and with the point of view of Ric, who founded the organisation, and leading us deep into what is happening at Taiji — very much a record of fact. It made my hair stand on end and left me cold, and made me feel deeply that protecting the ocean is protecting ourselves."
  [entry.zh]
  title = "海豚湾"
  text  = "我看过的第一部纪录片，能进入豆瓣电影top250片单也是意义深重。第一次了解海豚在太地町的遭遇和海豚所面临的日益严峻的生存环境。拍摄团队用隐藏的摄像机的镜头，航拍、夜视仪、水下录像设备等形式展现了海豚遭到捕杀的一系列画面，也通过采访第一人称等形式展现了旁观者对待海豚的态度和认知，以及日本政府对于此事的无能和置之不理的荒诞态度。纪录片用插叙的形式先用几个夜视仪中的海豚湾的镜头和组织创办者里克的视角带领我们深入探索太地町发生的捕杀海豚的事件，很有纪实性。这部影片看得我毛骨悚然，不寒而栗，让我深深的感受到了保护海洋环境就是在保护人类。"

# ── 43 ── 喜剧之王 ─────────────────────────────────
[[entry]]
year  = 1999
title = "King of Comedy"
text  = "The second Stephen Chow film I have seen that he both directed and starred in. I think it is better made than Kung Fu Hustle; the extra story lines make it richer. It feels as though it has captured much of what performers actually go through, and how they grow. There is a lot here I can learn from: how the narrative is laid out, how characters are brought on, how you shoot the connection between two people, transitions built around montage, the use of a MacGuffin. And lines worth savouring. In short, Chow's films may be shot a little more simply, but the scripts are solid and the substance is rich — they lose nothing to a Hollywood picture, and that shows how far he will go to get a thing right."
  [entry.zh]
  title = "喜剧之王"
  text  = "看过的第2部星爷自导自演的作品！感觉比《功夫》拍的好，故事线的增加丰富了剧情。感觉这部片子拍出了很多演艺人过往的经历和成长的过程。我觉得这部影片有很多值得我学习和鉴赏的地方，比如交代叙事的方式、人物的出场方式、如何拍摄两个角色间的关联、配合蒙太奇的转场、麦高芬的运用。还有值得仔细品位的台词。总之我觉得星爷的电影虽然可能拍摄的稍微简陋一点，但剧本扎实、内涵丰富，完全不输好莱坞大片，这也体现出星爷精益求精的职业精神。"

# ── 44 ── 美国往事 ─────────────────────────────────
[[entry]]
year  = 1984
title = "Once Upon a Time in America"
text  = "A film that puts its weight on narrative. It opens out of sequence to introduce its characters and where they now stand, then uses a montage of time and a flashback to carry us back to Noodles' childhood. It weaves narration through itself, switching between memory and the present, and it takes time to keep track of. The film stock also seems inconsistent: in the church the image switches suddenly to something antique, and the raised contrast and darkened exposure take some adjusting to. For 1984 the staging is fluid and considered — the camera's shifts of position and of shot size imply the relationships and the standings between people, build atmosphere, and close the distance to the audience. Staging that smooth was very advanced for its moment. The film also likes to use close-ups to show the fear inside a character, and fixed positions to show the small changes in what they feel. Music runs through the whole thing alongside the narrative, a lilting, winding melody with a quiet sadness in it; when its rhythm goes from gentle to soaring, the feeling has been building to a peak."
  [entry.zh]
  title = "美国往事"
  text  = "《美国往事》是一部强调叙事性的电影。影片开篇用插叙介绍人物出场和现状，又用时间蒙太奇和倒叙的手法带我们拉回到面条的童年。影片用了很多穿插的叙事，在回忆和现实中来回切换，需要花时间辨认。其次，影片拍摄所用的胶片似乎不一致，在教堂的场景中突然切换为一种复古的胶片，对比度的增加和曝光的压暗需要观众适应。1984年的《美国往事》在镜头调度上很流畅和用心，镜头的位移和景别的转换可以起到暗示人物间关系和地位的作用，还能烘托气氛，拉近与观众的距离。这样流畅连贯的调度在当时的电影拍摄十分先进。此外，《美国往事》喜欢用镜头特写展现人物内心的恐惧，也喜欢用固定机位呈现人物情绪细微的变化。音乐伴随整部影片和叙事的推进，悠扬婉转的曲调，带有淡淡的忧伤。音乐节奏由舒缓到高亢也意味着情绪的酝酿达到高潮"

# ── 45 ── 致命ID ─────────────────────────────────
[[entry]]
year  = 2003
title = "Identity"
text  = "Among the many films about split personalities, Identity holds its place through its particular way of telling the story and the carefully built suspense and logic. Much of the horror along its main line comes from the locations, and from how the lighting and the sound work together: rain, thunder, lightning, a remote motel, unexpected guests, an accident on the road. The film is not long but draws several of its characters in detail, and its chapters keep their grip. You can see that the murder scenes deliberately imitate the famous sequence in Psycho. When a killing happens it always comes with terrible thunder and a scene in disarray, or an urgent shout; when the search begins, the film follows the characters and uses shot-reverse-shot to bring out their nerves and pull the audience's feelings along. Then, once the feeling has built to the point where your heart is about to come out of your chest, the director uses a slow push on a medium shot and the environment to uncover the truth a step at a time. The film asks a certain amount of its audience. All told, four stars."
  [entry.zh]
  title = "致命ID"
  text  = "在众多精神分裂症电影中，《致命ID》凭借它独特的叙事方式、精心塑造的超强的悬疑型和逻辑性占据一席之地。这部影片中主线所塑造的恐怖效果，很大程度上来自拍摄场景的环境，以及拍摄时灯光和音效的配合。下雨天、打雷、闪电、偏僻的旅馆、不速之客、和意外车祸等要素烘托了紧张、阴森的氛围。影片不长，但对几位角色刻画的比较细致。影片章节扣人心弦。发生凶案的画面拍摄能看得出是在有意模仿影片《惊魂记》中的经典场面。当凶杀案发生时，总会伴随骇人的闪电雷声和杂乱不堪的场景，或是急切的呼喊。而当探查时，又会用对人物的跟拍和正反打的方式突出人物内心的紧张，拉拢观看者情绪，当情绪烘托到一定程度，观众悬着的心都要跳出来时，导演会用缓慢的中景别推镜头和环境渲染一步步揭开真相。影片对观众的理解能力有一定门槛。综合下来给四星"

# ── 46 ── 杀人回忆 ─────────────────────────────────
[[entry]]
year  = 2003
title = "Memories of Murder"
text  = "A crime film that works your head. On first viewing it is confusing, but the ending seems clear enough: the young man Park Hyun-kyu is the serial killer, and he has come back to the town to go on. Detective Park's eyes never do see through him, and by the end of the investigation even the most level-headed of them, Detective Seo, has completely lost his temper. Memories of Murder is a model of the crime-suspense film: from raising the case, to analysing it, to the misunderstandings in the middle, to the officers' feelings breaking loose once it has stalled, and the accidents that keep happening. Bong Joon-ho's narration is close to perfect, and he builds his characters through it, which makes them fuller. He likes to tell a story with a fixed camera, and he handles his actors' movement very well, using the camera to show where a person stands, what power they hold and what they feel. The rhythm goes from slow to fast and then passes through music into the final act and the coda, and the use of location adds to the story throughout. From The Crucible and Hope to Memories of Murder, Korean cinema likes to put a train into a film and tie it to the plot — practically a local speciality."
  [entry.zh]
  title = "杀人回忆"
  text  = "一部烧脑的逻辑推理片。第一次看未免有些疑惑，但结局似乎已清晰明了了，小青年朴贤奎就是连环杀人案的凶手，且又回到镇上继续作案。朴探警的眼睛终究没有看穿凶手，案件探查到最后连最理智的徐警官到最后也彻底发飙。《杀人回忆》绝对是犯罪悬疑片的典范，从引出案情，到案件分析、中间出现的误会，到最后案件陷入焦灼后警员们情绪的宣泄和不断发生的意外……导演的叙事堪称完美，对人物的塑造也穿插其中，让人物形象更加立体。奉俊昊导演喜欢用固定镜头讲故事，对人物的调动也把控的很好，他会用镜头的移动展现人物立场，人物势力和情绪，影片对节奏的把控由慢到快再由音乐过度，进入终章和尾声。对场景的运用为剧情添砖加瓦。从《熔炉》《素媛》到《杀人回忆》，韩国电影也喜欢将火车这一交通工具搬进电影并与剧情关联，属于是韩国电影土特产了"

# ── 47 ── 红辣椒 ─────────────────────────────────
[[entry]]
year  = 2006
title = "Paprika"
text  = "I did not understand it the first time; having finished it, all I can do is marvel. It was the first time I had seen science fiction shot as animation. The image does not draw you in the way 3D animation does, but Satoshi Kon's handling of flat images gives up nothing to three-dimensional space. The film brings in dreams — a concept even now we cannot explain — and warns us to use technology sensibly. I did not quite follow how Detective Konakawa reads the film, and I hope a second viewing will fix that. The science fiction in it is not that heavy, and yet through reality and dream the director gives the audience a visual feast. The theme appears at both the start and the end, and its melody sounds fogged and far away, exactly like being inside a dream — it is the finishing stroke. On sound and image: when a character is in danger the film does not cut away but first pushes in or goes to a close-up, bringing out the face. Paprika created a style of its own, giving the audience a dream in a form nobody had used before — by the end even I felt the world in front of me starting to come loose from the real."
  [entry.zh]
  title = "红辣椒"
  text  = "第一遍没看懂，看完只能用惊叹来形容这部电影。能用漫画的方式拍出科幻片还是第一次见。画面虽然没3D动画那样有代入感，但今敏导演对于平面图像的应用一点都不输三维空间。本片的主题用一个当今社会也无法解释的概念“梦”代入，告诫了人们要合理利用科学技术。但本片里男主粉川警部对电影的解读没太看懂，希望能在第二遍观看时弥补。整部影片的科幻色彩并没有那么浓厚，但导演却用现实与梦境给观众呈现了一场视觉盛宴。影片的主题曲在开头和结尾都有出现，音乐的旋律听起来云里雾里，就很符合梦境中的感觉，是《红辣椒》中的点睛之笔。视听层面，当角色面临危险时，不会直接切画面，而是先给角色拉近或特写，突出人物面部表情。总之，《红辣椒》开创了一种风格，用新颖的展现方式给了观众一场“梦”，就连我看完都会觉得眼前的世界开始变得不真实了"

# ── 48 ── 唐伯虎点秋香 ─────────────────────────────────
[[entry]]
year  = 1993
title = "Flirting Scholar"
text  = "Personally the hardest of these to judge. People say there is always something deeper in Chow's films, but with this one, on a first viewing, I did not find any great truth in it — perhaps because he did not direct it. There is nothing especially new in the content; at most the scene at the end where he wins Qiuxiang is a little fresher. The plot is still worth praising, and I came to like the way Wah On is set up. Beyond that, in the last fight between Wah On and the Scholar of Death, Wah On is brought on first through opera and then handed over to the Tang family spear — that way of introducing a character is striking. I have tried several times to watch this film and could not get through it; perhaps it felt too excruciating, or too crude. Nothing much stayed with me afterwards, only a few of the fights, which were genuinely rousing. I hope my score goes up when I watch it a second time. For now, two stars — the film seems to run almost entirely on performance and on faces."
  [entry.zh]
  title = "唐伯虎点秋香"
  text  = "个人认为最难评的一部影片。都说星爷的电影蕴含深意，但仅这部影片来说，第一遍并没有看出什么深刻的道理，或许不是星爷导演的缘故。《唐伯虎点秋香》在内容上感觉没什么新颖的地方，顶多就是结尾点秋香的情景新鲜一些，整部影片的故事情节还是值得称赞的，华安的设定在看完后觉得还挺好的。除此之外，华安与夺命书生的最后一场打斗戏中华安的出场是先由戏曲引出在过渡到唐家枪，这样的人物出场方式让人眼前一亮。这部影片我几次看都看不下去，可能是觉得演的太尬了或太低俗了。第一遍看完后感觉没有让我留下什么深刻印象，只有几处打斗戏还看得挺热血的。我希望我第二次看这部片子时评分能高一些，先打个2星吧，感觉这部片子基本上全靠演技和颜值撑场唉"

