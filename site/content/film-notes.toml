year  = 1927
title = "Metropolis"
note_kind = "class"   # 课堂笔记：短句堆叠，原样保留
text  = "A clock with only ten numbers marks capitalism's exploitation of ordinary people. A dystopian work. Shows the difference between social classes and the sharpening of their contradiction. Visual impact: extravagant sets. Dystopian in type, but utopian in its ending. Dystopia: anti-totalitarian, presenting a world of catastrophe, wealth divided severely. Maria the robot breaks anthropocentrism. A representative of the posthuman. Surrealism and the decentring of the human. The process by which the robot Maria evolves does not directly show a fusion of the human and the inorganic, and does not entirely fit the transformation from human to cyborg. Maria as a figure: the Madonna; a figure capable of inciting. The anxiety that modern technology and the urban woman bring to the bourgeoisie. The rise of women's position. The process of modernity. Stereotyped images of women. Instrumentalised. Cyberpunk: high tech, low life. The catacombs: a benighted Middle Ages. The underground city as the buried past, pointing to the shackles of darkness. German Expressionism: building particular sets that fold expressionism into art. Its features: highly symbolic, artistic, surreal, dark in mood; stories full of horror and crime; unusual visual design; instrumentalisation — the workers driven, for instance."
