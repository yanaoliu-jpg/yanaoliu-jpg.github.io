# ── 08 ── 爱乐之城 ─────────────────────────────────
[[entry]]
year  = 2016
title = "La La Land"
text  = "A film that holds music, story and editing all at once. What stayed with me most is the opening, cut like a music video: introducing the two leads separately, each through their own point of view, felt new to me. \"City of Stars\" runs through the whole picture and stays with you afterwards. The seasons cut the film into five parts, each with its own palette, mood and meaning. Music is the subject, and around it the film argues about dreams, love and work. The story peaks in the honeymoon of summer. Again and again it sets dance to music to show how good love can be, and the dreamlike run back through time at the end is devastating. Narrative, cross-cut, parallel and musical montage are all used to hold the rhythm — the mix at the opening party especially. It made me feel that a good film rests not on effects but on shots and technique. It earns its place: the craft of folding this many elements into one film is in a class of its own."
  [entry.zh]
  title = "爱乐之城"
  text  = "一部兼具音乐、剧情、剪辑手法的影片。最让我印象深刻的是影片MV式的开头。开篇分别与男女主视角交代生活背景的形式耳目一新。贯穿全片的《City Of Stars》令人回味。以四季的形式将影片切割为5个部分，每部分有独立的影调、情绪、和意义，各具特色。本片以音乐为主题，围绕梦想，爱情与事业展开讨论。故事的发展在夏季的蜜月中达到高潮。影片多次以音乐配舞蹈的形式展现爱情的美好。结尾梦境般的时光回溯催人泪下。全篇多用叙事蒙太奇、交叉蒙太奇、平行蒙太奇和音乐蒙太奇的剪辑手法将影片的节奏把控的很好，特别是开头晚会上的混剪，让我感觉好影片靠的不是特效，而是镜头和手法。不愧是好莱坞大片，能把多种元素融入影片的技术是独一档的！"

