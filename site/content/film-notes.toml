  title = "花样年华"
  text  = "再一次感叹王家卫的才华，将一个精彩绝伦的故事在这样一个狭小的空间里，用每一个细节去体现出来。这部片的布景把一个狭小的空间做出了高级感，梁朝伟和张曼玉之间的对话则以运镜的形式表达。张曼玉最终没有离开她的丈夫，而梁朝伟在回去找她未果后，选择把秘密讲给那段残垣断壁——最终那个「树洞」开出了绿芽。这段故事没有别人知道，就这样永远埋没在了上世纪六十年代的香港。梁朝伟和张曼玉的几次相遇都发生在暴雨天和阶梯上，似乎也预示着这段感情的波折和错位。"
