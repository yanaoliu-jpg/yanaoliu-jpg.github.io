# ── 55 ── 爆裂鼓手 ─────────────────────────────────
[[entry]]
year  = 2014
title = "Whiplash"
text  = "The first film I watched after a long time away — nearly two years without one before I came back to that world. Short video keeps accelerating, but for anyone who loves film these classics on the Douban list are always worth taking slowly. This one reaches a new height in its use of music: many images have the music of the next scene entering before the cut, and that background sound turns out to be what the lead, or the rehearsal room, is playing in the scene we arrive at. The lighting design brings out the lead's inner world and magnifies what he feels; each time he plays, the focus of the spotlights is like a monologue from inside him. Many of the shots bring out his obsession with drumming, and his mania. Together they turn the film into a real drummer's autobiography."
