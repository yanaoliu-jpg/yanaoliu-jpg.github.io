text  = "The second of the talking trilogy. It is shorter than the first, but with Before Sunrise laid down beneath it, this one feels more mature and holds more philosophy. The two of them have not changed; only their age and the years have. They still meet as they did, talking and laughing, easy and unconstrained. They tell each other the nine years of hardship and journey they have each had, and together they feel how the years have worn down the edges of their pursuit of romance. But their warmth toward each other has not changed. As the sea takes in rivers, they are each other's harbour, the port where the ship unloads, the point where two minds cross."
