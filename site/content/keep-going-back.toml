statement = """
2025 年的暑假对我来说是一段难忘又记忆犹新的回忆。七月底我去上海参加了一个夏校，住处是离市中心很远的一所国际学校——那里远离了城市的喧嚣，又保留着临海城市那种深沉舒服的海风。三天里活动排得很满，可那些活动我几乎一张都没拍。

到的那天晚上，我在一个大厅里看见天花板上垂下成千上万颗小玻璃球，四个人就坐在下面的地毯上聊天。第二天下午整个校园是空的：一条笔直穿过两排树的马路，一片操场上只有一个人在对面跑。后来下起雨，我隔着一扇看不清的窗，拍了外面的城市。

最后一天我们进了城，去了电影博物馆。有人在整面亮着的老电影海报墙前站了很久；有人俯身去看那一排老式摄影机和成堆的胶片罐；有人反戴着帽子，伸手转动那个西洋镜，看转盘上一圈红蓝小人跑起来。

事后我才发现：这九张里没有一个人是看着镜头的。他们都在看别的东西，而我总在窗外、在展柜玻璃的另一边、在跑道的对面。那天夜里，有人抱着吉他坐到地上，二十来个人围过来，几乎都举着手机；我在最后面，举的是相机。这一张，是我到今天还会回去的那一张。
"""
