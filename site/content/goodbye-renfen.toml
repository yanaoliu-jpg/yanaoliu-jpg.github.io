人分是我最难忘的母校。这里装着数不清的记忆、思绪，还有说不完的话。也许照片就是留住它们最好的方式。

这些照片拍的都是最日常、最平凡的场景：教室、楼道、操场。它们像一片片记忆的碎片，重新拼起我的整个初中。
