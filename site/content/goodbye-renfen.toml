statement = """
人分——人大附中分校，是我一直放不下的学校。三年发生在那里，能说的太多了。大概正因为太多，我最后是带着相机回去的，而不是带着话。

那是 2024 年五月，刚考完 AP。结果我拍下的全是这栋楼里最不起眼的地方：一条走廊、一段楼道、操场、一间没有人的教室。走过它们的时候是两种感觉同时发生——完全平常，又不太真实，好像那些教室里发生过的事就在昨天，人马上就要回来了。

那天是下午晚些时候，夕阳正沿着每一面墙走。我想是那束光把它打开的。有些一年没想起过的事，随着我一步步走过去，又回来了。

最后我拍的是校门。那不是一扇好看的门。它每天早上按时打开，没人会多看它一眼。可我的三年就停在那里。这些照片是碎片，把它们重新拼回去，是我能离那三年最近的方式。
"""
