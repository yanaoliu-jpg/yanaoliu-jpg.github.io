# ─────────────────────────────────────────────────────────────────
statement = """
Renfen — my middle school — is the one I have never been able to forget. It holds more memories, more thoughts, more unsaid words than I could count. Perhaps photographs are the best way to keep them.

What these pictures record are the most everyday, most ordinary scenes: classrooms, corridors, the yard. They are like fragments of memory, reassembling what my middle school years were.
"""

