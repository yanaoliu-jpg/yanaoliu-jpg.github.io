# ═══════════════════════════════════════════════════════════════════
#  站点级设置 —— 只管首页（作品总目录）上的文字。
#  下划线开头的文件不会被当成作品系列。
#
#  每期作品自己的文字在同目录下的 good-night.toml / goodbye-renfen.toml。
# ═══════════════════════════════════════════════════════════════════

name = "Yanao (Leo) Liu"

# 搜索引擎和别人分享链接时看到的一句话
# ⚠️ {years} 会被 build.py 换成实际的年份跨度（现在是 2023–2026），别写死。
#   这句手写年份的时候过期过两次：作品加到 2025、2026 了，它还挂着
#   「between 2023 and 2024」。这是搜索结果和分享链接里露出的那一行，
#   写错比写笼统糟糕得多。
description = "Photographs made in China, {years}."

# ─────────────────────────────────────────────────────────────────
#  首页开头那段话 —— 招生官点开链接第一眼读到的东西。
#
#  不用长，三到五句就够。可以说：
#    · 你从什么时候开始拍、用什么拍
#    · 你一般拍什么、为什么是这些
#    · 这个网站是什么（几组作品的合集）
#
#  跟作品自述一样：先写中文给我，我转英文。
#  空一行就是分段。
# ─────────────────────────────────────────────────────────────────
intro = """
This is my album. What it holds is memory — the kind I can only keep by photographing it.

The camera is my brush and my way of looking. I use it to set down the world as it appears to me, and the countless small moments that ordinary life is made of.
"""

# ─────────────────────────────────────────────────────────────────
#  「关于」那一区（2026-09「放映厅」改版）。
#  左边是上面那两段开场白；右边几行事实。下面这三项是手写的，
#  其余（作品数、年份、获奖）构建时自动算，不会过期。
# ─────────────────────────────────────────────────────────────────
place = "Beijing"                                    # 所在。原来叫 footer，页脚也用它
gear = "Sony α7 IV · Sigma 24-70mm F2.8 DG DN Art"   # 器材，原样抄自各组的署名
# 联系邮箱。空着就不显示「联系」那一行，页脚也不写。改了之后跑 build.py。
# ⚠️ 网站是公开的，谁都看得到——公开的邮箱会收到垃圾邮件。
#    网页源码里它会被写成字符编码（&#121;&#97;…），挡掉一部分按正则扫邮箱的程序；读者看到的一样。
#    换邮箱的话，site/tools/verify.js 的 about 节里 EMAIL 也要改。
email = "yanao_liu@jidjdfz.com"


# ═══════════════════════════════════════════════════════════════════
#  中文版（/zh/）。没写的项会自动用上面的英文，不会开天窗。
# ═══════════════════════════════════════════════════════════════════
[zh]
name = "刘延奥"
description = "{years} 年拍下的几组照片。"
place = "北京"
gear = "索尼 α7 IV · 适马 24-70mm F2.8 DG DN Art"

intro = """
这是我的相册，里面装的是记忆——有些东西，只有拍下来才留得住。

相机是我的画笔，也是我看世界的方式。我用它记下眼里的世界，记下人间烟火里那些数不清的细小瞬间。
"""
