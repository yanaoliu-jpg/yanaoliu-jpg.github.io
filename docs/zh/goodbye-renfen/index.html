      <h1 class="masthead__title">再见，人分</h1>
      <p class="masthead__meta"><span>9 张</span><span>2024 年 5 月</span><span>北京</span></p>
    </div>

    <div class="statement">
      <p>人分——是我最难忘的母校。这里承载着数不清的记忆、思绪，还有千言万语。也许照片是留住这些回忆最好的方式。</p>
          <p>这些照片记载着一些最生活、最平凡的场景：教室、楼道、还有操场。它们像记忆碎片，重新拼接起我对中学的回忆。</p>
    </div>

    <p class="masthead__scroll" aria-hidden="true">向下</p>
